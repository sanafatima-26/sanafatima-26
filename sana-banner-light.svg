<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280"
     height="740"
     viewBox="0 0 1280 740">

<defs>

  <!-- MAIN BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#09001f"/>
    <stop offset="45%" stop-color="#16052d"/>
    <stop offset="100%" stop-color="#020617"/>
  </linearGradient>

  <!-- NEON GRADIENT -->
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff4ecd"/>
    <stop offset="45%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#22d3ee"/>
  </linearGradient>

  <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff6bd6"/>
    <stop offset="50%" stop-color="#a78bfa"/>
    <stop offset="100%" stop-color="#67e8f9"/>
  </linearGradient>

  <!-- GLOW -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <!-- PHOTO CLIP -->
  <clipPath id="photoClip">
    <rect x="760" y="100" width="430" height="500" rx="30"/>
  </clipPath>

  <!-- GRID -->
  <pattern id="grid"
           width="42"
           height="42"
           patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42"
          fill="none"
          stroke="#8b5cf6"
          stroke-opacity=".12"/>
  </pattern>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1280" height="740" rx="28" fill="url(#bg)"/>

<rect width="1280"
      height="740"
      rx="28"
      fill="url(#grid)"/>


<!-- LARGE GLOWING ORBS -->

<circle cx="180"
        cy="160"
        r="180"
        fill="#8b5cf6"
        opacity=".12"
        filter="url(#softGlow)">
  <animate attributeName="r"
           values="170;210;170"
           dur="7s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1080"
        cy="560"
        r="220"
        fill="#ec4899"
        opacity=".10"
        filter="url(#softGlow)">
  <animate attributeName="r"
           values="210;250;210"
           dur="8s"
           repeatCount="indefinite"/>
</circle>


<!-- ================================================= -->
<!-- TOP NEON LINE -->
<!-- ================================================= -->

<rect x="48"
      y="42"
      width="1184"
      height="2"
      fill="url(#neon)"
      opacity=".8"
      filter="url(#glow)">
  <animate attributeName="x"
           values="48;700;48"
           dur="5s"
           repeatCount="indefinite"/>
</rect>


<!-- ================================================= -->
<!-- LEFT TERMINAL -->
<!-- ================================================= -->

<g transform="translate(55 70)">

  <!-- terminal -->
  <rect width="650"
        height="500"
        rx="22"
        fill="#080b18"
        stroke="#8b5cf6"
        stroke-opacity=".55"
        stroke-width="1.5"/>

  <!-- terminal header -->
  <rect width="650"
        height="46"
        rx="22"
        fill="#111528"/>

  <circle cx="25" cy="23" r="6" fill="#ff5f57"/>
  <circle cx="45" cy="23" r="6" fill="#febc2e"/>
  <circle cx="65" cy="23" r="6" fill="#28c840"/>

  <text x="325"
        y="29"
        text-anchor="middle"
        fill="#94a3b8"
        font-family="monospace"
        font-size="12">
    megha@portfolio ~
  </text>


  <!-- terminal content -->

  <text x="28"
        y="82"
        fill="#22d3ee"
        font-family="monospace"
        font-size="15">
    $ whoami
  </text>

  <text x="28"
        y="112"
        fill="#f8fafc"
        font-family="monospace"
        font-size="20"
        font-weight="bold">
    Megha Mittal
  </text>


  <text x="28"
        y="150"
        fill="#22d3ee"
        font-family="monospace"
        font-size="15">
    $ role
  </text>

  <text x="28"
        y="180"
        fill="#c4b5fd"
        font-family="monospace"
        font-size="17">
    Data Analyst • Data Science Enthusiast
  </text>


  <text x="28"
        y="220"
        fill="#22d3ee"
        font-family="monospace"
        font-size="15">
    $ skills
  </text>

  <text x="28"
        y="250"
        fill="#f8fafc"
        font-family="monospace"
        font-size="15">
    Python
  </text>

  <text x="28"
        y="278"
        fill="#f8fafc"
        font-family="monospace"
        font-size="15">
    SQL
  </text>

  <text x="28"
        y="306"
        fill="#f8fafc"
        font-family="monospace"
        font-size="15">
    Data Analytics
  </text>

  <text x="28"
        y="334"
        fill="#f8fafc"
        font-family="monospace"
        font-size="15">
    Data Science
  </text>

  <text x="28"
        y="362"
        fill="#f8fafc"
        font-family="monospace"
        font-size="15">
    Machine Learning
  </text>


  <!-- blinking cursor -->

  <text x="28"
        y="405"
        fill="#22d3ee"
        font-family="monospace"
        font-size="15">
    $ build --portfolio
  </text>

  <rect x="205"
        y="392"
        width="9"
        height="18"
        fill="#ff4ecd">
    <animate attributeName="opacity"
             values="1;0;1"
             dur="1s"
             repeatCount="indefinite"/>
  </rect>

</g>


<!-- ================================================= -->
<!-- NAME / INTRO -->
<!-- ================================================= -->

<g transform="translate(55 610)">

  <text x="0"
        y="0"
        fill="#94a3b8"
        font-family="monospace"
        font-size="14">
    ✦ HELLO WORLD
  </text>

  <text x="0"
        y="38"
        fill="url(#nameGradient)"
        font-family="Arial, sans-serif"
        font-size="30"
        font-weight="bold">
    Hi, I'm Megha Mittal
  </text>

  <text x="0"
        y="65"
        fill="#cbd5e1"
        font-family="Arial, sans-serif"
        font-size="14">
    I turn data into insights and ideas into projects.
  </text>

</g>


<!-- ================================================= -->
<!-- PHOTO AREA -->
<!-- ================================================= -->

<g>

  <!-- glowing photo border -->

  <rect x="750"
        y="88"
        width="450"
        height="524"
        rx="34"
        fill="none"
        stroke="url(#neon)"
        stroke-width="2"
        opacity=".8"
        filter="url(#glow)">
    <animate attributeName="opacity"
             values=".45;1;.45"
             dur="3s"
             repeatCount="indefinite"/>
  </rect>


  <!-- photo background -->

  <rect x="760"
        y="100"
        width="430"
        height="500"
        rx="30"
        fill="#111827"/>


  <!-- YOUR PHOTO -->

  <image
      x="760"
      y="100"
      width="430"
      height="500"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#photoClip)"
      href="./profile.jpg"
      xlink:href="./profile.jpg"/>


  <!-- dark overlay -->

  <rect x="760"
        y="100"
        width="430"
        height="500"
        rx="30"
        fill="url(#photoOverlay)"
        opacity=".08"/>

</g>


<!-- ================================================= -->
<!-- FLOATING PARTICLES -->
<!-- ================================================= -->

<g fill="#c4b5fd">

  <circle cx="730" cy="150" r="3">
    <animate attributeName="cy"
             values="150;120;150"
             dur="4s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="720" cy="320" r="2">
    <animate attributeName="cy"
             values="320;280;320"
             dur="5s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1220" cy="190" r="3">
    <animate attributeName="cy"
             values="190;150;190"
             dur="3.5s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1210" cy="430" r="2">
    <animate attributeName="cy"
             values="430;390;430"
             dur="4.5s"
             repeatCount="indefinite"/>
  </circle>

</g>


<!-- ================================================= -->
<!-- PIXEL HEART -->
<!-- ================================================= -->

<g transform="translate(1130 625)"
   fill="#ff4ecd"
   filter="url(#glow)">

  <rect x="0" y="8" width="8" height="8"/>
  <rect x="8" y="0" width="8" height="8"/>
  <rect x="16" y="0" width="8" height="8"/>
  <rect x="24" y="8" width="8" height="8"/>
  <rect x="8" y="8" width="16" height="8"/>
  <rect x="8" y="16" width="16" height="8"/>
  <rect x="16" y="24" width="8" height="8"/>

  <animateTransform
      attributeName="transform"
      type="scale"
      values="1;1.18;1"
      dur="2s"
      repeatCount="indefinite"/>
</g>


<!-- ================================================= -->
<!-- SCANNING LIGHT -->
<!-- ================================================= -->

<rect x="760"
      y="100"
      width="430"
      height="3"
      fill="url(#neon)"
      opacity=".7"
      filter="url(#glow)">

  <animate attributeName="y"
           values="100;597;100"
           dur="4s"
           repeatCount="indefinite"/>

</rect>


<!-- ================================================= -->
<!-- BOTTOM FOOTER -->
<!-- ================================================= -->

<line x1="48"
      y1="690"
      x2="1232"
      y2="690"
      stroke="url(#neon)"
      stroke-opacity=".5"/>

<text x="48"
      y="718"
      fill="#64748b"
      font-family="monospace"
      font-size="12">
    Code • Learn • Build • Repeat
</text>

<text x="1232"
      y="718"
      text-anchor="end"
      fill="#64748b"
      font-family="monospace"
      font-size="12">
    Megha Mittal
</text>


<!-- ================================================= -->
<!-- MOVING SCAN -->
<!-- ================================================= -->

<rect x="48"
      y="676"
      width="180"
      height="2"
      fill="#ff4ecd"
      filter="url(#glow)">

  <animate attributeName="x"
           values="48;1050;48"
           dur="5s"
           repeatCount="indefinite"/>

</rect>


</svg>
