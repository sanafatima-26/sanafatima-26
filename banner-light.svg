
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sana Fatima | Data Analyst & AI Enthusiast</title>

    <meta name="description"
          content="Sana Fatima - B.E. Computer Science & Engineering | Data Analytics | Python | SQL | Power BI | AI">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
            color: #f5f5f5;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* NAVBAR */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(8, 8, 8, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #222;
        }

        nav {
            max-width: 1150px;
            margin: auto;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #d4af37;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            color: #ddd;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #d4af37;
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            max-width: 1150px;
            margin: auto;
            padding: 150px 25px 80px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 70px;
        }

        .hero-content {
            flex: 1;
        }

        .small-title {
            color: #d4af37;
            font-size: 15px;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: clamp(45px, 7vw, 82px);
            line-height: 1;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #d4af37;
        }

        .hero h2 {
            color: #aaa;
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        .hero p {
            color: #aaa;
            max-width: 650px;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 13px 25px;
            border: 1px solid #d4af37;
            border-radius: 5px;
            transition: 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: #d4af37;
            color: #080808;
        }

        .btn-primary:hover {
            background: transparent;
            color: #d4af37;
        }

        .btn-outline {
            color: #d4af37;
        }

        .btn-outline:hover {
            background: #d4af37;
            color: #080808;
        }

        /* PROFILE PHOTO */

        .profile-container {
            width: 310px;
            height: 310px;
            border-radius: 50%;
            padding: 7px;
            border: 2px solid #d4af37;
            flex-shrink: 0;
            box-shadow: 0 0 45px rgba(212, 175, 55, 0.15);
        }

        .profile-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* GENERAL */

        section {
            max-width: 1150px;
            margin: auto;
            padding: 100px 25px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 55px;
        }

        .section-title h2 {
            font-size: 40px;
        }

        .section-title span {
            color: #d4af37;
        }

        .section-title p {
            color: #888;
            margin-top: 10px;
        }

        /* ABOUT */

        .about-box {
            border: 1px solid #292929;
            background: #0e0e0e;
            border-radius: 15px;
            padding: 35px;
        }

        .about-box p {
            color: #aaa;
            font-size: 17px;
            margin-bottom: 18px;
        }

        /* SKILLS */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
        }

        .skill {
            background: #101010;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 22px;
            text-align: center;
            transition: 0.3s;
        }

        .skill:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
        }

        .skill h3 {
            color: #d4af37;
            font-size: 18px;
        }

        /* PROJECTS */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .project {
            background: #101010;
            border: 1px solid #292929;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .project:hover {
            transform: translateY(-8px);
            border-color: #d4af37;
        }

        .project img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .project-content {
            padding: 25px;
        }

        .project h3 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 21px;
        }

        .project p {
            color: #999;
            margin-bottom: 18px;
        }

        .project-link {
            color: #d4af37;
            font-weight: bold;
        }

        /* EXPERIENCE */

        .timeline {
            border-left: 2px solid #d4af37;
            padding-left: 30px;
        }

        .timeline-item {
            background: #101010;
            border: 1px solid #292929;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
        }

        .timeline-item h3 {
            color: #d4af37;
            margin-bottom: 5px;
        }

        .timeline-item p {
            color: #999;
        }

        /* ACHIEVEMENTS */

        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .achievement {
            background: #101010;
            border: 1px solid #292929;
            padding: 28px;
            border-radius: 12px;
        }

        .achievement h3 {
            color: #d4af37;
            margin-bottom: 8px;
        }

        .achievement p {
            color: #999;
        }

        /* CONTACT */

        .contact-box {
            text-align: center;
            background: #101010;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 50px 25px;
        }

        .contact-box h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .contact-box p {
            color: #999;
            margin-bottom: 25px;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .contact-info a {
            color: #d4af37;
        }

        /* FOOTER */

        footer {
            border-top: 1px solid #222;
            text-align: center;
            padding: 30px 20px;
            color: #777;
        }

        footer span {
            color: #d4af37;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .nav-links {
                display: none;
            }

            .hero {
                flex-direction: column-reverse;
                text-align: center;
                padding-top: 130px;
            }

            .hero p {
                margin-left: auto;
                margin-right: auto;
            }

            .buttons {
                justify-content: center;
            }

            .profile-container {
                width: 230px;
                height: 230px;
            }

            .section-title h2 {
                font-size: 32px;
            }
        }
    </style>
</head>

